# backwork.dev — self-hosted log aggregation + APM, monitoring the REAL Docker host.
#   loki            log storage (LogQL)
#   victoriametrics metrics TSDB (PromQL)  scrapes cAdvisor + Vector
#   cadvisor        REAL per-container CPU / memory / network / disk metrics
#   jaeger          trace store (OTLP in) for any instrumented app
#   vector          collector: tails EVERY container's logs -> Loki
#   backwork        the dashboard — queries all backends
# Deployed on the host it watches (Vector + cAdvisor read the host docker.sock /
# cgroups), so every number is real container telemetry, never synthetic.
services:
  loki:
    build: ./infra/loki
    command: -config.file=/etc/loki/loki-config.yaml
    restart: unless-stopped
    mem_limit: 640m
    volumes:
      - loki-data:/loki
    expose:
      - "3100"

  victoriametrics:
    build: ./infra/victoriametrics
    command:
      - -storageDataPath=/vmdata
      - -retentionPeriod=14d
      - -promscrape.config=/etc/vm/scrape.yml
      - -promscrape.config.strictParse=false
    restart: unless-stopped
    mem_limit: 640m
    volumes:
      - vm-data:/vmdata
    expose:
      - "8428"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    privileged: true
    mem_limit: 384m
    environment:
      # bserve runs Docker 28 (min API 1.44); pin the client so cAdvisor's
      # docker factory (which provides container names + labels) negotiates ok.
      DOCKER_API_VERSION: "1.44"
    command:
      - -housekeeping_interval=10s
      - -docker_only=true
      - -store_container_labels=false
      - -whitelisted_container_labels=coolify.resourceName,coolify.projectName,com.docker.compose.service
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    mem_limit: 320m
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
      MEMORY_MAX_TRACES: "20000"
    expose:
      - "16686"  # query UI + API
      - "4317"   # OTLP gRPC
      - "4318"   # OTLP HTTP

  vector:
    build: ./infra/vector
    restart: unless-stopped
    mem_limit: 320m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector-data:/vector-data
    command: --config /etc/vector/vector.yaml
    expose:
      - "9598"
    depends_on:
      - loki

  backwork:
    build: ./dashboard
    restart: unless-stopped
    mem_limit: 512m
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOKI_URL: http://loki:3100
      VM_URL: http://victoriametrics:8428
      JAEGER_URL: http://jaeger:16686
      DATA_DIR: /data
      OTLP_ENDPOINT: http://jaeger:4318
      DOCKER_SOCKET: /var/run/docker.sock
    volumes:
      - backwork-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "3000"
    depends_on:
      - loki
      - victoriametrics
      - cadvisor

volumes:
  loki-data:
  vm-data:
  vector-data:
  backwork-data:
