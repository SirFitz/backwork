# backwork.dev — log search, request tracing and performance figures from
# Correlator hop records. Five containers:
#   loki            log storage (LogQL); hop records 30 days, other lines 7
#   victoriametrics metrics TSDB (PromQL); scrapes Vector's hop metrics
#   postgres        users, orgs, projects, switches, filter patterns
#   vector          collector: tails backwork's OWN containers (the ones labelled
#                   dev.backwork.collect=true) -> Loki, detects hop records,
#                   filters sensitive data, hop metrics. Also stores the lines
#                   the dashboard takes at /ingest/records and /ingest/otlp/v1/logs. It mounts the Docker
#                   socket read-only because that is how Vector reads container logs.
#   backwork        the dashboard: queries Loki and VictoriaMetrics
# Every other service, on this host or another, ships with the agent
# (/install.sh) under its own organisation.
services:
  loki:
    build: ./infra/loki
    labels:
      dev.backwork.collect: "true"
    command: -config.file=/etc/loki/loki-config.yaml
    restart: unless-stopped
    mem_limit: 640m
    volumes:
      - loki-data:/loki
    expose:
      - "3100"

  victoriametrics:
    build: ./infra/victoriametrics
    labels:
      dev.backwork.collect: "true"
    command:
      - -storageDataPath=/vmdata
      - -retentionPeriod=14d
      - -promscrape.config=/etc/vm/scrape.yml
      - -promscrape.config.strictParse=false
    restart: unless-stopped
    mem_limit: 640m
    volumes:
      - vm-data:/vmdata
    expose:
      - "8428"

  postgres:
    image: postgres:16-alpine
    labels:
      dev.backwork.collect: "true"
    restart: unless-stopped
    mem_limit: 320m
    environment:
      POSTGRES_DB: backwork
      POSTGRES_USER: backwork
      POSTGRES_PASSWORD: ${PG_PASSWORD:-backwork_dev_pw}
    volumes:
      - pg-data:/var/lib/postgresql/data
    expose:
      - "5432"

  vector:
    build: ./infra/vector
    restart: unless-stopped
    mem_limit: 320m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector-data:/vector-data
    command: --config /etc/vector/vector.yaml
    expose:
      - "9598"
      # records input: lines from /ingest/records and /ingest/otlp/v1/logs, posted by the
      # dashboard after authentication, switches and filter (BAC-96). Compose network only.
      - "8687"
    depends_on:
      - loki

  backwork:
    build: ./dashboard
    labels:
      dev.backwork.collect: "true"
    restart: unless-stopped
    mem_limit: 512m
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOKI_URL: http://loki:3100
      VM_URL: http://victoriametrics:8428
      DATA_DIR: /data
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      # Left empty when unset: the app falls back to https://backwork.dev, but Google sign-in then needs
      # GOOGLE_SIGNIN_REDIRECT_URI (or an explicit PUBLIC_URL) so a staging deploy never calls back to production.
      PUBLIC_URL: ${PUBLIC_URL:-}
      GOOGLE_SIGNIN_REDIRECT_URI: ${GOOGLE_SIGNIN_REDIRECT_URI:-}
      DATABASE_URL: postgresql://backwork:${PG_PASSWORD:-backwork_dev_pw}@postgres:5432/backwork
      SESSION_SECRET: ${SESSION_SECRET:-backwork-dev-session-secret-change-me}
      AUTH_PEPPER: ${AUTH_PEPPER:-backwork-dev-pepper-change-me}
      # Product analytics (BAC-103): all optional; unset means no tracker and no server events.
      FLATLYTICS_SITE_KEY: ${FLATLYTICS_SITE_KEY:-}
      FLATLYTICS_SECRET_KEY: ${FLATLYTICS_SECRET_KEY:-}
      FLATLYTICS_SCRIPT_URL: ${FLATLYTICS_SCRIPT_URL:-}
      # Sign in with Google (BAC-101). Off while the client id is empty. Redirect URI to register:
      # https://backwork.dev/auth/google/callback
      GOOGLE_SIGNIN_CLIENT_ID: ${GOOGLE_SIGNIN_CLIENT_ID:-}
      GOOGLE_SIGNIN_CLIENT_SECRET: ${GOOGLE_SIGNIN_CLIENT_SECRET:-}
    volumes:
      - backwork-data:/data
    expose:
      - "3000"
    depends_on:
      - loki
      - victoriametrics
      - postgres
      - vector

volumes:
  loki-data:
  vm-data:
  vector-data:
  backwork-data:
  pg-data:
