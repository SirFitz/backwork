# backwork.dev — log search, request tracing and performance figures from
# Correlator hop records. Five containers:
#   loki            log storage (LogQL); hop records 30 days, other lines 7
#   victoriametrics metrics TSDB (PromQL); scrapes Vector's hop metrics
#   postgres        users, orgs, projects, switches, filter patterns
#   vector          collector: tails EVERY container's logs on this host -> Loki,
#                   detects hop records, filters sensitive data, hop metrics
#   backwork        the dashboard — queries Loki and VictoriaMetrics
# Other hosts ship to it with the agent (/install.sh). Jaeger and cAdvisor were
# removed on 2026-11-12 (stack slimmed to tracing, performance and log search).
services:
  loki:
    build: ./infra/loki
    command: -config.file=/etc/loki/loki-config.yaml
    restart: unless-stopped
    mem_limit: 640m
    volumes:
      - loki-data:/loki
    expose:
      - "3100"

  victoriametrics:
    build: ./infra/victoriametrics
    command:
      - -storageDataPath=/vmdata
      - -retentionPeriod=14d
      - -promscrape.config=/etc/vm/scrape.yml
      - -promscrape.config.strictParse=false
    restart: unless-stopped
    mem_limit: 640m
    volumes:
      - vm-data:/vmdata
    expose:
      - "8428"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 320m
    environment:
      POSTGRES_DB: backwork
      POSTGRES_USER: backwork
      POSTGRES_PASSWORD: ${PG_PASSWORD:-backwork_dev_pw}
    volumes:
      - pg-data:/var/lib/postgresql/data
    expose:
      - "5432"

  vector:
    build: ./infra/vector
    restart: unless-stopped
    mem_limit: 320m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector-data:/vector-data
    command: --config /etc/vector/vector.yaml
    expose:
      - "9598"
    depends_on:
      - loki

  backwork:
    build: ./dashboard
    restart: unless-stopped
    mem_limit: 512m
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOKI_URL: http://loki:3100
      VM_URL: http://victoriametrics:8428
      DATA_DIR: /data
      # The stack no longer runs Jaeger: the dashboard does not trace itself.
      OTEL_SDK_DISABLED: "true"
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      PUBLIC_URL: ${PUBLIC_URL:-https://backwork.dev}
      DATABASE_URL: postgresql://backwork:${PG_PASSWORD:-backwork_dev_pw}@postgres:5432/backwork
      SESSION_SECRET: ${SESSION_SECRET:-backwork-dev-session-secret-change-me}
      AUTH_PEPPER: ${AUTH_PEPPER:-backwork-dev-pepper-change-me}
    volumes:
      - backwork-data:/data
    expose:
      - "3000"
    depends_on:
      - loki
      - victoriametrics
      - postgres

volumes:
  loki-data:
  vm-data:
  vector-data:
  backwork-data:
  pg-data:
