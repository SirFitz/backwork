# VictoriaMetrics scrape config. Real metrics from cAdvisor (per-container CPU /
# memory / network / disk for every container on the host) plus Vector + self.
global:
  scrape_interval: 15s
  external_labels:
    monitor: backwork

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: vector
    static_configs:
      - targets: ["vector:9598"]
        labels:
          service: vector

  - job_name: victoriametrics
    static_configs:
      - targets: ["victoriametrics:8428"]
        labels:
          service: victoriametrics
