# VictoriaMetrics scrape config — pulls Prometheus metrics from the stack.
# Every instrumented service exposes /metrics; VM stores the time series that
# power the backwork APM + resource dashboards.
global:
  scrape_interval: 10s
  external_labels:
    monitor: backwork

scrape_configs:
  - job_name: victoriametrics
    static_configs:
      - targets: ["victoriametrics:8428"]
        labels:
          service: victoriametrics

  - job_name: vector
    static_configs:
      - targets: ["vector:9598"]
        labels:
          service: vector

  # The instrumented demo services. Each exports prom-client default process
  # metrics (cpu/mem/eventloop) + custom http request/error/latency histograms.
  - job_name: services
    static_configs:
      - targets: ["api:9100"]
        labels:
          service: api
      - targets: ["payments:9100"]
        labels:
          service: payments
      - targets: ["worker:9100"]
        labels:
          service: worker
