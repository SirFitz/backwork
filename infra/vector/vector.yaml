# backwork collector. Tails EVERY container on the host's stdout/stderr,
# derives a friendly service name from Coolify/compose labels, normalises the
# level, and ships to Loki. Also exposes host + internal metrics for VM.
data_dir: /vector-data

sources:
  docker:
    type: docker_logs
    exclude_containers:
      - vector            # don't tail ourselves

  vector_metrics:
    type: internal_metrics

  host:
    type: host_metrics
    scrape_interval_secs: 15
    collectors:
      - cpu
      - memory
      - disk
      - filesystem
      - load
      - network

transforms:
  normalize:
    type: remap
    inputs: [docker]
    source: |
      labels = object(.label) ?? {}

      # Friendly service name: Coolify resource name > compose service > container.
      svc = get(labels, ["coolify.resourceName"]) ?? null
      if svc == null { svc = get(labels, ["com.docker.compose.service"]) ?? null }
      .service = to_string(svc) ?? to_string(.container_name) ?? "unknown"
      .project = to_string(get(labels, ["coolify.projectName"]) ?? "") ?? ""
      .role = to_string(get(labels, ["com.docker.compose.service"]) ?? "") ?? ""

      # Structured JSON logs: lift level/msg.
      .level = "info"
      parsed = parse_json(.message) ?? {}
      lvl = get(parsed, ["level"]) ?? get(parsed, ["lvl"]) ?? get(parsed, ["severity"]) ?? null
      if lvl != null {
        # pino/bunyan use numeric levels (10=trace..60=fatal); map them.
        # default to -1 so the comparisons are infallible (ln is always int).
        ln = to_int(lvl) ?? -1
        if ln >= 60 { .level = "fatal" }
        else if ln >= 50 { .level = "error" }
        else if ln >= 40 { .level = "warn" }
        else if ln >= 30 { .level = "info" }
        else if ln >= 20 { .level = "debug" }
        else if ln >= 10 { .level = "trace" }
        else { .level = downcase(to_string(lvl) ?? "info") }
      }
      msg = get(parsed, ["msg"]) ?? get(parsed, ["message"]) ?? null
      if msg != null { .display = to_string(msg) ?? .message }
      if !exists(.display) { .display = .message }

      # Heuristic level for unstructured lines (proxies, runtimes, DBs).
      if .level == "info" {
        m = downcase(to_string(.message) ?? "")
        if contains(m, "level=error") || contains(m, "\"error\"") || contains(m, "[error]") || contains(m, "panic") || contains(m, "fatal") || contains(m, "exception") {
          .level = "error"
        } else if contains(m, "level=warn") || contains(m, "[warn]") || contains(m, "warning") || contains(m, "deprecat") {
          .level = "warn"
        } else if contains(m, "level=debug") || contains(m, "[debug]") {
          .level = "debug"
        }
      }

      # normalise odd level spellings
      if .level == "warning" { .level = "warn" }
      if .level == "err" || .level == "critical" || .level == "crit" { .level = "error" }

sinks:
  loki:
    type: loki
    inputs: [normalize]
    endpoint: http://loki:3100
    encoding:
      codec: json
    labels:
      service: "{{ service }}"
      level: "{{ level }}"
    out_of_order_action: accept
    remove_label_fields: false

  prometheus:
    type: prometheus_exporter
    inputs: [vector_metrics, host]
    address: 0.0.0.0:9598
