# Agent config + generated controls: project has named fields off;
# svc-no-hops has hop records off; svc-no-logs has ordinary logs and stores off.
tests:
  - name: org pattern and built-ins filtered before leaving the host; ids kept
    inputs:
      - insert_at: bw_normalize
        type: log
        log_fields:
          container_name: commerce-api
          message: "member MBR-123456 card 4111111111111111 trace_id=6503f5f183b828139d5b143365ad72fa ends secret-tail"
    outputs:
      - extract_from: bw_controls
        conditions:
          - type: vrl
            source: |
              assert_eq!(.message, "member [filtered] card [filtered] trace_id=6503f5f183b828139d5b143365ad72fa ends [filtered]")
              assert_eq!(.host, "test-host")
              assert_eq!(.kind, "log")

  - name: named fields stripped at project level (kv and json), rest unchanged
    inputs:
      - insert_at: bw_normalize
        type: log
        log_fields:
          container_name: commerce-payments
          message: "trace_id=6503f5f183b828139d5b143365ad72fa hop=in_end hop_id=5d9e0b3347c1a2f8 parent_id=b7ad6b7169203331 via=http outcome=ok duration_us=14800 db_n=2 db_us=3500 f_order_id=7731 f_currency=JMD"
    outputs:
      - extract_from: bw_controls
        conditions:
          - type: vrl
            source: |
              assert_eq!(.message, "trace_id=6503f5f183b828139d5b143365ad72fa hop=in_end hop_id=5d9e0b3347c1a2f8 parent_id=b7ad6b7169203331 via=http outcome=ok duration_us=14800 db_n=2 db_us=3500")

  - name: json named fields stripped one level down
    inputs:
      - insert_at: bw_normalize
        type: log
        log_fields:
          container_name: commerce-risk
          message: '{"message":"hop","metadata":{"trace_id":"6503f5f183b828139d5b143365ad72fa","hop":"in_end","hop_id":"a7d03b5e9c2f4816","parent_id":"b7ad6b7169203331","via":"http","outcome":"ok","duration_us":7900,"f_score":"12"}}'
    outputs:
      - extract_from: bw_controls
        conditions:
          - type: vrl
            source: |
              m = parse_json!(.message)
              assert!(!exists(m.metadata.f_score))
              assert_eq!(m.metadata.hop_id, "a7d03b5e9c2f4816")

  - name: hop records off for one service drops them (and their metrics)
    no_outputs_from: [bw_controls, bw_hop_duration, bw_hop_started]
    inputs:
      - insert_at: bw_normalize
        type: log
        log_fields:
          container_name: svc-no-hops
          message: "trace_id=6503f5f183b828139d5b143365ad72fa hop=in hop_id=5d9e0b3347c1a2f8 parent_id=b7ad6b7169203331 via=http"

  - name: same service still ships ordinary lines
    inputs:
      - insert_at: bw_normalize
        type: log
        log_fields:
          container_name: svc-no-hops
          message: "GET / 200"
    outputs:
      - extract_from: bw_controls
        conditions:
          - type: vrl
            source: assert_eq!(.kind, "log")

  - name: logs off drops ordinary lines; stores off drops data-store hops and strips totals
    no_outputs_from: [bw_controls]
    inputs:
      - insert_at: bw_normalize
        type: log
        log_fields:
          container_name: svc-no-logs
          message: "GET / 200"
      - insert_at: bw_normalize
        type: log
        log_fields:
          container_name: svc-no-logs
          message: "trace_id=6503f5f183b828139d5b143365ad72fa hop=out_end hop_id=b6f20e9d41c7a385 parent_hop=5d9e0b3347c1a2f8 hop_sent=false parent_id=b7ad6b7169203331 via=db op=select outcome=ok duration_us=1200"

  - name: stores off strips totals and makes no store metrics
    no_outputs_from: [bw_hop_store]
    inputs:
      - insert_at: bw_normalize
        type: log
        log_fields:
          container_name: svc-no-logs
          message: "trace_id=6503f5f183b828139d5b143365ad72fa hop=in_end hop_id=5d9e0b3347c1a2f8 parent_id=b7ad6b7169203331 via=http outcome=ok duration_us=14800 db_n=2 db_us=3500"
    outputs:
      - extract_from: bw_controls
        conditions:
          - type: vrl
            source: assert_eq!(.message, "trace_id=6503f5f183b828139d5b143365ad72fa hop=in_end hop_id=5d9e0b3347c1a2f8 parent_id=b7ad6b7169203331 via=http outcome=ok duration_us=14800")
      - extract_from: bw_hop_duration
        conditions:
          - type: vrl
            source: assert_eq!(.tags.service, "svc-no-logs")

  - name: query text kept with the line; named-field-looking text inside stmt survives named fields off (BAC-51)
    inputs:
      - insert_at: bw_normalize
        type: log
        log_fields:
          container_name: commerce-db
          message: "trace_id=6503f5f183b828139d5b143365ad72fa hop=out_end hop_id=83c2d1907ae45b16 parent_hop=1f0a6c2e9b7d4405 hop_sent=false parent_id=b7ad6b7169203331 adapter=ecto via=db op=update table=orders peer=db.internal outcome=ok duration_us=900 stmt=update orders set f_note = ?, status=? where id = ?"
    outputs:
      - extract_from: bw_controls
        conditions:
          - type: vrl
            source: |
              assert_eq!(.message, "trace_id=6503f5f183b828139d5b143365ad72fa hop=out_end hop_id=83c2d1907ae45b16 parent_hop=1f0a6c2e9b7d4405 hop_sent=false parent_id=b7ad6b7169203331 adapter=ecto via=db op=update table=orders peer=db.internal outcome=ok duration_us=900 stmt=update orders set f_note = ?, status=? where id = ?")

  - name: query text off removes table and stmt (kv and json), the rest unchanged (BAC-51)
    inputs:
      - insert_at: bw_normalize
        type: log
        log_fields:
          container_name: svc-no-query
          message: "trace_id=6503f5f183b828139d5b143365ad72fa hop=out_end hop_id=83c2d1907ae45b16 parent_hop=1f0a6c2e9b7d4405 hop_sent=false parent_id=b7ad6b7169203331 adapter=ecto via=db op=select table=merchants peer=db.internal outcome=ok duration_us=15200 stmt=select ... from merchants as m0 where (m0.username = ?) limit ?"
      - insert_at: bw_normalize
        type: log
        log_fields:
          container_name: svc-no-query
          message: '{"level":30,"trace_id":"6503f5f183b828139d5b143365ad72fa","hop":"out_end","hop_id":"93c2d1907ae45b16","parent_hop":"1f0a6c2e9b7d4405","hop_sent":false,"parent_id":"b7ad6b7169203331","adapter":"pg","via":"db","op":"insert","table":"charges","peer":"payments-db","outcome":"ok","duration_us":2300,"stmt":"insert into charges (id, amount) values (?)","msg":"hop"}'
    outputs:
      - extract_from: bw_controls
        conditions:
          - type: vrl
            source: |
              m = to_string(.message) ?? ""
              assert!(!contains(m, "stmt"))
              assert!(!contains(m, "table"))
              assert!(contains(m, "op=select") || contains(m, "\"op\":\"insert\""))
              assert!(contains(m, "duration_us"))

  - name: a repeated trace_id (host metadata and the record) is still a hop record
    inputs:
      - insert_at: bw_normalize
        type: log
        log_fields:
          container_name: commerce-api
          message: "13:46:21.018 trace_id=6503f5f183b828139d5b143365ad72fa [info] trace_id=6503f5f183b828139d5b143365ad72fa hop=in hop_id=1f0a6c2e9b7d4405 parent_id=b7ad6b7169203331 service=commerce-api adapter=plug via=http method=POST op=/orders"
    outputs:
      - extract_from: bw_controls
        conditions:
          - type: vrl
            source: |
              assert_eq!(.kind, "hop")
              assert_eq!(.service, "commerce-api")

  - name: timestamp, level and differing metadata in front; the record's own values win
    inputs:
      - insert_at: bw_normalize
        type: log
        log_fields:
          container_name: commerce-api-staging
          message: "2026-11-12T13:00:00.123Z [info] request_id=F8Zx2o1yQk0AAAEB service=meta-svc trace_id=7a1e3c5b9d2f4a6c8e0b1d3f5a7c9e1b trace_id=6503f5f183b828139d5b143365ad72fa hop=in_end hop_id=1f0a6c2e9b7d4405 parent_id=b7ad6b7169203331 service=commerce-api adapter=plug via=http method=POST op=/orders outcome=ok status=201 duration_us=61240"
    outputs:
      - extract_from: bw_controls
        conditions:
          - type: vrl
            source: |
              assert_eq!(.kind, "hop")
              assert_eq!(.service, "commerce-api")
              assert_eq!(.source, "commerce-api-staging")

  - name: stmt holding trace_id=? and hop=in stays inside stmt and does not confuse detection
    inputs:
      - insert_at: bw_normalize
        type: log
        log_fields:
          container_name: commerce-api
          message: "trace_id=6503f5f183b828139d5b143365ad72fa hop=out_end hop_id=83c2d1907ae45b16 parent_hop=1f0a6c2e9b7d4405 hop_sent=false parent_id=b7ad6b7169203331 service=commerce-api adapter=ecto via=db op=select table=hops peer=db.internal outcome=ok duration_us=900 stmt=select h0.id from hops as h0 where (h0.trace_id = ?) and hop=in and trace_id=?"
    outputs:
      - extract_from: bw_controls
        conditions:
          - type: vrl
            source: |
              assert_eq!(.kind, "hop")
              assert!(ends_with(to_string(.message) ?? "", "stmt=select h0.id from hops as h0 where (h0.trace_id = ?) and hop=in and trace_id=?"))

  - name: request paths kept by default, removed with Request paths off (kv and json), op unchanged (BAC-52)
    inputs:
      - insert_at: bw_normalize
        type: log
        log_fields:
          container_name: commerce-web
          message: "trace_id=6503f5f183b828139d5b143365ad72fa hop=in hop_id=1f0a6c2e9b7d4405 parent_id=b7ad6b7169203331 adapter=fastify via=http method=GET op=/v1/payments/:id path=/v1/payments/pay_8Kx2"
    outputs:
      - extract_from: bw_controls
        conditions:
          - type: vrl
            source: |
              assert!(contains(to_string(.message) ?? "", " path=/v1/payments/pay_8Kx2"))

  - name: request paths off for one service removes path (kv and json) (BAC-52)
    inputs:
      - insert_at: bw_normalize
        type: log
        log_fields:
          container_name: svc-no-paths
          message: "trace_id=6503f5f183b828139d5b143365ad72fa hop=in hop_id=1f0a6c2e9b7d4405 parent_id=b7ad6b7169203331 adapter=fastify via=http method=GET op=/v1/payments/:id path=/v1/payments/pay_8Kx2"
      - insert_at: bw_normalize
        type: log
        log_fields:
          container_name: svc-no-paths
          message: '{"level":30,"trace_id":"6503f5f183b828139d5b143365ad72fa","hop":"in","hop_id":"2f0a6c2e9b7d4405","parent_id":"b7ad6b7169203331","adapter":"fastify","via":"http","method":"GET","op":"/v1/payments/:id","path":"/v1/payments/pay_8Kx2","msg":"hop"}'
    outputs:
      - extract_from: bw_controls
        conditions:
          - type: vrl
            source: |
              m = to_string(.message) ?? ""
              assert!(!contains(m, "path"))
              assert!(contains(m, "/v1/payments/:id"))

  - name: NestJS logger level read from the line, with or without colour codes (BAC-41 row 9)
    inputs:
      - insert_at: bw_normalize
        type: log
        log_fields:
          container_name: commerce-api-ts
          message: "\x1b[33m[Nest] 4120  - \x1b[39m11/12/2026, 10:01:03 AM \x1b[33m   WARN\x1b[39m \x1b[38;5;3m[Payouts] \x1b[39m\x1b[33mbank gateway slow\x1b[39m"
      - insert_at: bw_normalize
        type: log
        log_fields:
          container_name: commerce-api-ts
          message: "[Nest] 4120  - 11/12/2026, 10:01:04 AM   ERROR [ExceptionsHandler] connect ECONNREFUSED"
      - insert_at: bw_normalize
        type: log
        log_fields:
          container_name: commerce-api-ts
          message: "[Nest] 4120  - 11/12/2026, 10:01:05 AM     LOG [RoutesResolver] AppController {/}"
    outputs:
      - extract_from: bw_controls
        conditions:
          - type: vrl
            source: |
              m = to_string(.message) ?? ""
              if contains(m, "WARN") { assert_eq!(.level, "warn") } else if contains(m, "ERROR") { assert_eq!(.level, "error") } else { assert_eq!(.level, "info") }

  - name: a structured line that mentions Nest keeps its own level (BAC-41 row 9)
    inputs:
      - insert_at: bw_normalize
        type: log
        log_fields:
          container_name: commerce-api-ts
          message: '{"level":50,"msg":"[Nest] says WARN in text"}'
    outputs:
      - extract_from: bw_controls
        conditions:
          - type: vrl
            source: assert_eq!(.level, "error")

  - name: an ordinary line of a source with hop records is stored under the service's own name (BAC-51)
    inputs:
      - insert_at: bw_normalize
        type: log
        log_fields:
          container_name: dev-commerce-api-dserve
          message: "GET /api/v1/public/m/demo/products trace_id=6503f5f183b828139d5b143365ad72fa loading products"
    outputs:
      - extract_from: bw_controls
        conditions:
          - type: vrl
            source: |
              assert_eq!(.kind, "log")
              assert_eq!(.service, "commerce-api")
              assert_eq!(.source, "dev-commerce-api-dserve")

  - name: a source with no hop records keeps its label (BAC-51)
    inputs:
      - insert_at: bw_normalize
        type: log
        log_fields:
          container_name: commerce-web
          message: "started in 120 ms"
    outputs:
      - extract_from: bw_controls
        conditions:
          - type: vrl
            source: |
              assert_eq!(.service, "commerce-web")
              assert_eq!(.source, "commerce-web")

  - name: a per-service switch acts on the lines it names under either label (BAC-51)
    no_outputs_from: [bw_controls]
    inputs:
      - insert_at: bw_normalize
        type: log
        log_fields:
          container_name: quiet-box
          message: "ordinary line of commerce-api-quiet"
