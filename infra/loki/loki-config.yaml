auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 7 days hot retention — matches the product brief's tiering model
  retention_period: 168h
  # Hop records and link lines (kind="hop") are kept 30 days (design 6);
  # ordinary lines stay at 7 days. Applied by the compactor per stream.
  retention_stream:
    - selector: '{kind="hop"}'
      priority: 1
      period: 720h
  reject_old_samples: false
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true
  volume_enabled: true
  max_query_series: 5000

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  # Plan limits trim a rolling window by deleting the oldest data (lib/plans/retention.server.ts).
  # Loki hides a deleted range from queries once this has passed, so keep it short: the default is 24 h,
  # which would leave a day of data beyond the plan's cap.
  delete_request_cancel_period: 10m

analytics:
  reporting_enabled: false
