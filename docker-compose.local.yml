# Local testing only. Publishes ports to the host so the stack can be
# inspected from the Mac. Coolify never reads this file (it deploys the
# base docker-compose.yaml). Use:
#   docker compose -f docker-compose.yaml -f docker-compose.local.yml up -d --build
services:
  loki:
    ports: ["3100:3100"]
  victoriametrics:
    ports: ["8428:8428"]
  backwork:
    # BW_LOCAL_PORT: this Mac already has something on 3000.
    ports: ["${BW_LOCAL_PORT:-3000}:3000"]
    environment:
      PUBLIC_URL: http://localhost:${BW_LOCAL_PORT:-3000}
  vector:
    ports: ["9598:9598"]

  # Fixture emitters (tests only, design section 14). Each writes the spec-exact
  # hop records, link lines and ordinary lines of one service of the two frame
  # requests (POST /orders healthy; POST /payouts/:id/release stalled), then one
  # generated request every CYCLE_S seconds. The collector names each service
  # after its compose service, as it would for a real one. Formats differ on
  # purpose so detection is exercised on every form. They carry the collect
  # label because the stack collector reads only labelled containers.
  commerce-api:
    build: ./qa/fixtures
    labels: { dev.backwork.collect: "true" }
    environment: { SERVICE: commerce-api, FORMAT: json, CYCLE_S: "30" }
    restart: unless-stopped
  commerce-payments:
    build: ./qa/fixtures
    labels: { dev.backwork.collect: "true" }
    environment: { SERVICE: commerce-payments, FORMAT: kv, CYCLE_S: "30" }
    restart: unless-stopped
  commerce-risk:
    build: ./qa/fixtures
    labels: { dev.backwork.collect: "true" }
    environment: { SERVICE: commerce-risk, FORMAT: json-nested, CYCLE_S: "30" }
    restart: unless-stopped
  commerce-worker:
    build: ./qa/fixtures
    labels: { dev.backwork.collect: "true" }
    environment: { SERVICE: commerce-worker, FORMAT: kv, CYCLE_S: "30" }
    restart: unless-stopped
